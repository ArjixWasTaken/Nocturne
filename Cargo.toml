[package]
name = "nocturne"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Music client for Jellyfin, OpenSubsonic/Navidrome and local files"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gst = { package = "gstreamer", version = "0.25" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
mpris-server = "0.10"
oo7 = { version = "0.4", default-features = false, features = ["tokio", "native_crypto"] }
lofty = "0.22"
walkdir = "2"
md-5 = "0.10"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lrc = "0.1"
futures = "0.3"
color-thief = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }

[build-dependencies]
glib-build-tools = "0.22"
