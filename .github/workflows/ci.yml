name: CI

on:
  pull_request:
  push:
    branches-ignore: [dev]

env:
  # Ubuntu's libadwaita is older than the templates need; the Flatpak build compiles them for real.
  NOCTURNE_PLACEHOLDER_UI: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
