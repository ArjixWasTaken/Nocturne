id: dev.arjix.Nocturne
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: nocturne
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/nocturne/cargo
finish-args:
  - '--share=network'
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--device=dri'
  - '--socket=wayland'
  - '--socket=pulseaudio'
  - '--own-name=org.mpris.MediaPlayer2.dev.arjix.Nocturne'
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-docw
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: nocturne
    builddir: true
    buildsystem: meson
    # Crates are fetched at build time; for Flathub, vendor them with flatpak-cargo-generator.
    build-options:
      build-args:
        - --share=network
    sources:
      - type: dir
        path: .
