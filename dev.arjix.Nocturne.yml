id: dev.arjix.Nocturne
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: nocturne
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/nocturne/cargo
finish-args:
  - '--share=network'
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--device=dri'
  - '--socket=wayland'
  - '--socket=pulseaudio'
  - '--own-name=org.mpris.MediaPlayer2.dev.arjix.Nocturne'
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-docw
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: nocturne
    builddir: true
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    sources:
      - type: dir
        path: .
        skip:
          - target
          - .flatpak-builder
          - .git
      # Vendored crates, regenerate after changing Cargo.lock:
      #   flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - cargo-sources.json
